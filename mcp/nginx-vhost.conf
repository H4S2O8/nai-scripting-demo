# NovelAI MCP server, reached through the Cloudflare tunnel on :80.
#
# An exact server_name is required: account-manager has `server_name _` and
# sorts first in sites-enabled, so it is the default for port 80 and would
# otherwise swallow this hostname.
server {
    listen 80;
    server_name nai.asylum.icu;

    access_log /var/log/nginx/novelai-mcp-access.log;
    error_log  /var/log/nginx/novelai-mcp-error.log;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP Streamable HTTP answers over SSE: buffering would hold the whole
        # event stream until the generation finished, which is the one thing
        # that must not happen when a call takes a minute.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Generation runs 30-120s; a batch runs longer.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
